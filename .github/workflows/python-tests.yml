# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        pyright-package: ["basedpyright", "pyright"]
    env:
      PYRIGHT_PACKAGE: ${{ matrix.pyright-package }}
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --all-extras --locked
    - name: Setup Node.js environment
      uses: actions/setup-node@v7.0.0

    - name: Install Pyright distribution
      run: npm install -g "$PYRIGHT_PACKAGE"
      env:
        NPM_CONFIG_PREFIX: ~/.npm-global

    - name: Add npm global bin to PATH
      run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

    - name: Test with pytest
      run: |
        uv run pytest tests
